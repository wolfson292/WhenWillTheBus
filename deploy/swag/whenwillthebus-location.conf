#
# Everything about reaching the WhenWillTheBus worker EXCEPT where it is
# mounted. Included by every subfolder that leads to it -- /worker/ and the
# original /whenwillthebus/ -- so the rules that stand in for a login cannot
# differ between two copies of them. Goes in /config/nginx/, beside proxy.conf.
#
# Each including location strips its own prefix AFTER including this (see the
# comment there on why the order matters): the worker serves
# /health, /status and the rest at the root and knows nothing about where it
# is mounted, which is right for an API.
#
# This endpoint holds a WheresTheBus password and knows a child's live
# location, so it is deliberately narrower than the other services here.

# NO authelia-location.conf, and that is not an oversight.
#
# The iOS app and its widget authenticate with a bearer token; they cannot
# complete a browser login flow, and including Authelia here would simply break
# them. The worker checks the token itself, comparing in fixed time so the
# endpoint cannot be used to guess it a byte at a time. The two rules below are
# what make up for the missing session layer.

# 1. Only Cloudflare may connect. nas.denlair.com is proxied, so legitimate
#    traffic always arrives from Cloudflare's ranges. Anything else is someone
#    who found the origin address directly and is talking past Cloudflare --
#    exactly the traffic worth refusing.
#
#    Not `allow`/`deny`: SWAG restores the visitor's address from
#    CF-Connecting-IP, so $remote_addr is no longer Cloudflare's and an
#    allow-list on it would refuse everyone. $wwtb_via_cloudflare is set from
#    the connecting address in 00-whenwillthebus-limits.conf.
if ($wwtb_via_cloudflare = 0) {
    return 403;
}

# 2. Rate limited per real visitor, so a leaked token cannot be used to poll a
#    child's position continuously. ONE zone for every path to the worker, so
#    a second address is not a second allowance.
limit_req zone=wwtb_visitor burst=10 nodelay;

#    nginx answers 503 by default, which reads as "the server is broken" and
#    invites a client to retry harder. 429 says what actually happened.
limit_req_status 429;

include /config/nginx/proxy.conf;
include /config/nginx/resolver.conf;
set $upstream_app whenwillthebus;
set $upstream_port 8080;
set $upstream_proto http;

proxy_pass $upstream_proto://$upstream_app:$upstream_port;
