#
# https://nas.denlair.com/worker/ -> the WhenWillTheBus worker.
#
# A second way in, for a person with a browser: the root sends them to the
# management page. The app stays on /whenwillthebus/ and must not be moved.
# The rules that guard both are in whenwillthebus-location.conf, so the two
# cannot drift apart.

location /worker {
    return 301 $scheme://$host/worker/;
}

location ^~ /worker/ {
    include /config/nginx/whenwillthebus-location.conf;

    # LAST. `break` ends the rewrite phase, and the `set $upstream_*` lines in
    # the include belong to that phase: placed first, it skipped them, and
    # proxy_pass went to "://:" with a 500 for every request.
    rewrite ^/worker/(.*)$ /$1 break;
}
