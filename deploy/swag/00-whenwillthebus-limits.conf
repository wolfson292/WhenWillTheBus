#
# http-context bits for the WhenWillTheBus worker. Lives in site-confs so nginx
# loads it in http context, and is named 00- so the zone exists before the
# proxy-conf that uses it.
#
# Rate limited on the REAL client, not on Cloudflare's address. Every request
# arrives from a Cloudflare edge IP, so limiting on $binary_remote_addr would
# lump unrelated people together and throttle almost nothing. CF-Connecting-IP
# carries the actual visitor.
map $http_cf_connecting_ip $wwtb_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# Generous for this app: the phone registers a push token, syncs history, and
# checks status. Handfuls of requests, not streams of them.
limit_req_zone $wwtb_client zone=whenwillthebus:1m rate=30r/m;
