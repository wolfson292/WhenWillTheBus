#
# http-context bits for the WhenWillTheBus worker. Lives in site-confs so nginx
# loads it in http context, and is named 00- so the zone exists before the
# proxy-conf that uses it.
#
# Assumes SWAG restores the visitor's address from CF-Connecting-IP, trusting
# that header only from Cloudflare's ranges (set_real_ip_from + real_ip_header
# in the http context). After that, $remote_addr is the real visitor and
# $realip_remote_addr is still whoever actually connected.

# 1. Did the connection come from Cloudflare? Judged on the connecting address,
#    not the restored one. From https://www.cloudflare.com/ips - re-check if
#    they change.
geo $realip_remote_addr $wwtb_via_cloudflare {
    default         0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22   1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15  1;
    104.16.0.0/13   1;
    104.24.0.0/14   1;
    172.64.0.0/13   1;
    131.0.72.0/22   1;
    2400:cb00::/32  1;
    2606:4700::/32  1;
    2803:f800::/32  1;
    2405:b500::/32  1;
    2405:8100::/32  1;
    2a06:98c0::/29  1;
    2c0f:f248::/32  1;
}

# 2. Rate limited on the real visitor. $binary_remote_addr is the restored
#    address, which nginx only takes from Cloudflare, so it cannot be forged by
#    sending a CF-Connecting-IP header straight to the origin.
#    Generous for this app: the phone registers a push token, syncs history,
#    and checks status. Handfuls of requests, not streams of them.
limit_req_zone $binary_remote_addr zone=wwtb_visitor:1m rate=30r/m;
