#
# https://nas.denlair.com/whenwillthebus/ -> the WhenWillTheBus worker.
#
# THE APP'S ADDRESS. Every phone is set up with this one, so it stays exactly
# as it is: moving it, or turning it into a redirect, cuts the app off -- its
# HTTP client deliberately follows no redirects (it replays the WheresTheBus
# login's 307 itself). /worker/ is a second way in, for a person with a browser.
#
# The rules that guard it are in whenwillthebus-location.conf, shared with
# /worker/, so the two cannot drift apart.

location /whenwillthebus {
    return 301 $scheme://$host/whenwillthebus/;
}

location ^~ /whenwillthebus/ {
    include /config/nginx/whenwillthebus-location.conf;

    # LAST. `break` ends the rewrite phase, and the `set $upstream_*` lines in
    # the include belong to that phase: placed first, it skipped them, and
    # proxy_pass went to "://:" with a 500 for every request.
    rewrite ^/whenwillthebus/(.*)$ /$1 break;
}
