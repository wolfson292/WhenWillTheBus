#
# https://nas.denlair.com/whenwillthebus/ -> the WhenWillTheBus worker.
#
# This endpoint holds a WheresTheBus password and knows a child's live location,
# so it is deliberately narrower than the other services here.

location /whenwillthebus {
    return 301 $scheme://$host/whenwillthebus/;
}

location ^~ /whenwillthebus/ {
    # NO authelia-location.conf, and that is not an oversight.
    #
    # The iOS app authenticates with a bearer token; it cannot complete a
    # browser login flow, and including Authelia here would simply break it.
    # The worker checks the token itself, comparing in fixed time so the
    # endpoint cannot be used to guess it a byte at a time. The two rules below
    # are what make up for the missing session layer.

    # 1. Only Cloudflare may connect. nas.denlair.com is proxied, so legitimate
    #    traffic always arrives from these ranges. Anything else is someone who
    #    found the origin address directly and is talking past Cloudflare --
    #    exactly the traffic worth refusing.
    #    From https://www.cloudflare.com/ips - re-check if they change.
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;

    # 2. Rate limited per real visitor, so a leaked token cannot be used to
    #    poll a child's position continuously.
    limit_req zone=whenwillthebus burst=10 nodelay;

    #    nginx answers 503 by default, which reads as "the server is broken" and
    #    invites a client to retry harder. 429 says what actually happened.
    limit_req_status 429;

    include /config/nginx/proxy.conf;
    include /config/nginx/resolver.conf;
    set $upstream_app whenwillthebus;
    set $upstream_port 8080;
    set $upstream_proto http;

    # The worker serves /health, /status and the rest at the root and knows
    # nothing about where it is mounted -- which is right for an API. Strip the
    # prefix here rather than teaching it a base path.
    rewrite ^/whenwillthebus/(.*)$ /$1 break;

    proxy_pass $upstream_proto://$upstream_app:$upstream_port;
}
