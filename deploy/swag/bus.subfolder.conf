#
# https://nas.denlair.com/bus/ -> the worker's /bus page: the app's Bus and Map
# tabs, for a laptop.
#
# NOT STRIPPED. The worker serves this page at /bus/ itself, so the path goes
# through as it is -- which is also why there is no `rewrite ... break` here to
# get in the way of the include. The page asks for the family key (any
# username) exactly as /worker/manage does.
#
# The same guard as every other way in (whenwillthebus-location.conf):
# Cloudflare only, and the same per-visitor rate limit, shared, so the page
# polling on a laptop is not a second allowance on top of the phones'.

location = /bus {
    return 301 $scheme://$host/bus/;
}

location ^~ /bus/ {
    include /config/nginx/whenwillthebus-location.conf;
}
