# SPDX-License-Identifier: GPL-3.0-or-later
#
# The Live Activity widget extension.
#
# Generated rather than hand-built in Xcode, so it is reproducible, reviewable
# in a diff, and regenerable after any change:
#
#     xcodegen generate --spec ios/project.yml
#
# WidgetKit UI has no C# path, so this target is the one piece of the app that
# must be SwiftUI. It holds only the card's LAYOUT -- everything deciding what
# the card SAYS is C# in WhenWillTheBus.Core.

name: WhenWillTheBusWidget

options:
  bundleIdPrefix: ${WWTB_BUNDLE_ID}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

targets:
  BusWidget:
    type: app-extension
    platform: iOS

    # BusActivityAttributes.swift is compiled into BOTH this extension and, via
    # the xcframework, the app itself. The two processes exchange that type, and
    # a copy that differs in either is an activity that starts perfectly and then
    # ignores every update -- no error, no log line, nothing on the phone.
    #
    # In a hand-built Xcode project this is the "Target Membership" checkbox
    # everyone forgets. Here it is structural: both builds read the same file
    # from the same path, so they cannot drift apart.
    sources:
      - path: LiveActivity

    info:
      path: BusWidget/Info.plist
      properties:
        CFBundleDisplayName: Bus
        CFBundleName: BusWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${WWTB_BUNDLE_ID}.BusWidget
        PRODUCT_NAME: BusWidget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

        # Signed automatically, like the host app.
        #
        # An embedded extension must be signed with the SAME certificate as its
        # parent or the build fails late, at embedded-binary validation. Turning
        # signing off HERE and on at the command line produced exactly that, so
        # the default is now "sign", and the simulator path -- which needs no
        # profile and must work without one -- opts out explicitly in
        # scripts/build-widget.sh.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${WWTB_TEAM}

  # Exists only to make Xcode mint provisioning profiles -- see
  # Provisioning/ProvisioningHostApp.swift. Never installed.
  ProvisioningHost:
    type: application
    platform: iOS
    sources:
      - path: Provisioning
    entitlements:
      path: Provisioning/Host.entitlements
    info:
      path: Provisioning/Info.plist
      properties:
        CFBundleDisplayName: Provisioning
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${WWTB_BUNDLE_ID}
        PRODUCT_NAME: ProvisioningHost
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Provisioning/Host.entitlements
    dependencies:
      - target: BusWidget
        embed: true
