<!--
  The app mark as a tab silhouette. iOS renders tab-bar images as TEMPLATES:
  only the alpha channel survives, and the bar tints the result. So the
  windscreen and the lamps have to be holes punched out of one path with
  fill-rule="evenodd", not shapes painted in the background colour - painted
  ones would come back as solid tint and the bus would be a blank slab.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <path fill="#FFFFFF" fill-rule="evenodd" d="M7 3 H17 A5 5 0 0 1 22 8 V16 A5 5 0 0 1 17 21 H7 A5 5 0 0 1 2 16 V8 A5 5 0 0 1 7 3 Z M7.5 6 H16.5 A2.5 2.5 0 0 1 19 8.5 V9.5 A2.5 2.5 0 0 1 16.5 12 H7.5 A2.5 2.5 0 0 1 5 9.5 V8.5 A2.5 2.5 0 0 1 7.5 6 Z M6.9 14.6 A1.8 1.8 0 1 0 6.9 18.2 A1.8 1.8 0 1 0 6.9 14.6 Z M17.1 14.6 A1.8 1.8 0 1 0 17.1 18.2 A1.8 1.8 0 1 0 17.1 14.6 Z"/>
</svg>
