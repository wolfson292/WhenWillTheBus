<!--
  The same mark as the app icon, without its ground: MauiSplashScreen paints
  the Color behind this, so the windscreen and grille cut through to it rather
  than sitting on a second, slightly-wrong dark rectangle.

  Keep the Color here and the icon's ground in step - both are #0E1117.

  NO TEXT. The wordmark belongs on the first frame of the app, not here: the
  splash is rasterised by resizetizer through SkiaSharp, which resolves fonts
  out of process and cannot be relied on to find SF Pro Rounded. A wordmark
  would have to ship as outlined paths, and a launch screen is supposed to be
  the cheapest thing in the app.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Body -->
  <rect x="22" y="26" width="84" height="80" rx="20" fill="#F6C445"/>
  <!-- Windscreen -->
  <rect x="32" y="38" width="64" height="30" rx="12" fill="#0E1117"/>
  <!-- Headlamps -->
  <circle cx="40" cy="88" r="7" fill="#FFF4D6"/>
  <circle cx="88" cy="88" r="7" fill="#FFF4D6"/>
  <!-- Grille -->
  <rect x="55" y="85" width="18" height="6" rx="3" fill="#0E1117" opacity="0.25"/>
</svg>
